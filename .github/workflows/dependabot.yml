version: 2
updates:
  # Dependències npm del projecte (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Dependències dels GitHub Actions (actions/checkout, actions/setup-node...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
